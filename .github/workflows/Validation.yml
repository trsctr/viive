name: Build and Validate

on:
  push:
    branches: [main, dev]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  CMAKE_BUILD_PARALLEL_LEVEL: 3
  STRICTNESS_LEVEL: 10
  TIMEOUT_MS: 60000

jobs:
  build_and_validate:
    name: Build and validate on ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: 'MacOS Latest',
            os: macos-latest,
            gen: 'make',
            cmake_config_flags: "-D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache -D CMAKE_OSX_ARCHITECTURES=arm64\\;x86_64 -D CMAKE_OSX_DEPLOYMENT_TARGET=10.15",
            cmake_build_flags: "--parallel 6",
            pluginval_link: "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip",
            pluginval_path: "pluginval.app/Contents/MacOS/pluginval"
          }
        - {
            name: 'Windows Latest',
            os: windows-latest,
            gen: 'MSVC',
            cmake_config_flags: "-D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache",
            pluginval_link: "https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip",
            pluginval_path: "./pluginval.exe"
          }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Enable ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-${{ env.BUILD_TYPE }}

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: Libs
        key: libs-${{ runner.os }}-${{ matrix.config.gen }}-${{ github.sha }}
        restore-keys: libs-${{ runner.os }}-${{ matrix.config.gen }}-

    - name: Configure CMake
      run: cmake -B Build ${{ matrix.config.cmake_config_flags }} -D CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build
      run: cmake --build Build --config ${{ env.BUILD_TYPE }} ${{ matrix.config.cmake_build_flags }}

    - name: Validate
      shell: bash
      working-directory: Build
      env:
        VALIDATE_IN_PROCESS: true
      run: |
        curl -LsS ${{ matrix.config.pluginval_link }} -o pluginval.zip
        unzip -q pluginval
        ${{ matrix.config.pluginval_path }} --validate *_artefacts/${{ env.BUILD_TYPE }}/VST3/*.vst3

    - name: Get safe ref name
      shell: bash
      run: echo "SAFE_REF_NAME=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV

    - name: Prepare artifacts
      shell: bash
      working-directory: Build
      run: |
        shopt -s extglob
        mkdir viive-${{ env.SAFE_REF_NAME }}-vst3-${{ runner.os }}
        mv *_artefacts/${{ env.BUILD_TYPE }}/VST3/*.vst3 viive-${{ env.SAFE_REF_NAME }}-vst3-${{ runner.os }}/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: viive-${{ env.SAFE_REF_NAME }}-vst3-${{ runner.os }}
        path: Build/viive-${{ env.SAFE_REF_NAME }}-vst3-${{ runner.os }}

  release:
    needs: build_and_validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: "**/*.zip"
        body_path: CHANGELOG.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}