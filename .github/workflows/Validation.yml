name: Build and Validate

on:
  push:
    branches: [main, dev]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  CMAKE_BUILD_PARALLEL_LEVEL: 3
  STRICTNESS_LEVEL: 10
  TIMEOUT_MS: 60000

jobs:
  build_and_validate:
    name: Build and validate on ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: 'MacOS Latest',
            os: macos-latest,
            gen: 'make',
            cmake_config_flags: "-D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache -D CMAKE_OSX_ARCHITECTURES=arm64\\;x86_64 -D CMAKE_OSX_DEPLOYMENT_TARGET=10.15",
            cmake_build_flags: "--parallel 6",
            pluginval_link: "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip",
            pluginval_sha256: "3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f",
            pluginval_path: "pluginval.app/Contents/MacOS/pluginval"
          }
        - {
            name: 'Windows Latest',
            os: windows-latest,
            gen: 'MSVC',
            cmake_config_flags: "-D CMAKE_C_COMPILER_LAUNCHER=ccache -D CMAKE_CXX_COMPILER_LAUNCHER=ccache",
            pluginval_link: "https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip",
            pluginval_sha256: "c08e61ce3b96db41636f8ec7e76f4c7e2c13ebdac7fa1b5a1f52b4f32ec715ab",
            pluginval_path: "./pluginval.exe"
          }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Enable ccache
      uses: https://github.com/hendrikmuhs/ccache-action/commit/d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
      with:
        key: ${{ runner.os }}-${{ env.BUILD_TYPE }}

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: Libs
        key: libs-${{ runner.os }}-${{ matrix.config.gen }}-${{ github.sha }}
        restore-keys: libs-${{ runner.os }}-${{ matrix.config.gen }}-

    - name: Configure CMake
      run: cmake -B Build ${{ matrix.config.cmake_config_flags }} -D CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

    - name: Build
      run: cmake --build Build --config ${{ env.BUILD_TYPE }} ${{ matrix.config.cmake_build_flags }}

    - name: Copy VST3 for validation
      shell: bash
      working-directory: Build
      run: |
        mkdir -p pluginval-input
        cp -r *_artefacts/${{ env.BUILD_TYPE }}/VST3/*.vst3 pluginval-input/

    - name: Validate
      shell: bash
      working-directory: Build
      env:
        VALIDATE_IN_PROCESS: true
      run: |
        curl -LsS ${{ matrix.config.pluginval_link }} -o pluginval.zip
        echo "${{ matrix.config.pluginval_sha256 }}  pluginval.zip" | sha256sum -c || { echo "pluginval checksum verification failed"; exit 1; }
        unzip -q pluginval
        ${{ matrix.config.pluginval_path }} --validate pluginval-input/*.vst3

    - name: Get safe ref name
      shell: bash
      run: echo "SAFE_REF_NAME=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV

    - name: Prepare artifacts
      shell: bash
      working-directory: Build
      run: |
        shopt -s extglob
        mkdir viive-${{ env.SAFE_REF_NAME }}-vst3-${{ runner.os }}
        mv *_artefacts/${{ env.BUILD_TYPE }}/VST3/*.vst3 viive-${{ env.SAFE_REF_NAME }}-vst3-${{ runner.os }}/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: viive-${{ env.SAFE_REF_NAME }}-vst3-${{ runner.os }}
        path: Build/viive-${{ env.SAFE_REF_NAME }}-vst3-${{ runner.os }}

  release:
    needs: build_and_validate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4

    - name: Zip artifacts
      run: |
        for dir in viive-*/; do
          (cd "$dir" && zip -r "../${dir%/}.zip" .)
        done

    - name: Create Release
      uses: https://github.com/softprops/action-gh-release/commit/b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
      with:
        files: "**/*.zip"
        body_path: CHANGELOG.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
